name: Verify delivery and recovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/bootstrap.py helm actionlint promtool
      - run: python tools/verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: static-verification
          path: artifacts/verification.json
          retention-days: 14

  integration:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python tools/bootstrap.py helm kind kubectl
      - run: python -m pip install -r requirements-dev.txt
      - name: Exercise failed releases and recovery in kind
        run: python tools/lab.py e2e
      - name: Validate monitoring configuration
        run: python tools/check_monitoring.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: recovery-evidence
          path: |
            artifacts/e2e.json
            artifacts/monitoring.json
            artifacts/**/*.txt
            artifacts/**/*.log
          retention-days: 14
      - name: Delete disposable cluster
        if: always()
        run: |
          if test -f artifacts/lab.kubeconfig; then
            python tools/lab.py down
          fi
